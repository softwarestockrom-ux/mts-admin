<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MTS SMM Admin - Fast Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #0a0f1c; color: #eef2ff; }
        
        /* Fast loading - minimal animations */
        .admin-container { display: flex; min-height: 100vh; }
        
        /* Sidebar - Fixed width, no animations */
        .admin-sidebar {
            width: 260px;
            background: #0d1425;
            border-right: 1px solid #1e293b;
            padding: 20px 15px;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
        }
        
        /* Main Content */
        .admin-main {
            flex: 1;
            margin-left: 260px;
            padding: 20px;
            background: #0a0f1c;
        }
        
        /* Quick Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #0d1425;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #1e293b;
        }
        .stat-card i { font-size: 28px; color: #2b6ef0; margin-bottom: 12px; display: block; }
        .stat-card h2 { font-size: 28px; font-weight: 700; }
        .stat-card p { color: #94a3b8; font-size: 13px; margin-top: 5px; }
        
        /* Card Grid for Data */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }
        .data-card {
            background: #0d1425;
            border-radius: 16px;
            border: 1px solid #1e293b;
            overflow: hidden;
        }
        .card-header {
            background: rgba(43, 110, 240, 0.1);
            padding: 12px 16px;
            border-bottom: 1px solid #1e293b;
            font-weight: 600;
        }
        .card-body { padding: 16px; }
        .card-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #1e293b;
        }
        .card-item:last-child { border-bottom: none; }
        .card-label { color: #94a3b8; font-size: 13px; }
        .card-value { font-weight: 500; }
        
        /* Buttons */
        .btn {
            background: #2b6ef0;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: 0.1s;
        }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .btn-danger { background: #dc2626; }
        .btn-success { background: #10b981; }
        .btn-warning { background: #f59e0b; }
        .btn-outline { background: transparent; border: 1px solid #2b6ef0; }
        
        /* Forms - Fast loading */
        input, select, textarea {
            background: #111827;
            border: 1px solid #1e293b;
            padding: 10px 14px;
            border-radius: 12px;
            color: white;
            width: 100%;
            outline: none;
            font-size: 14px;
        }
        input:focus { border-color: #2b6ef0; }
        
        /* Navigation */
        .admin-nav-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 10px 12px;
            text-align: left;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin: 2px 0;
            font-size: 14px;
            transition: 0.1s;
        }
        .admin-nav-btn:hover, .admin-nav-btn.active {
            background: #2b6ef0;
            color: white;
        }
        .admin-nav-btn i { width: 24px; margin-right: 10px; }
        
        /* Status Badges */
        .badge {
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            display: inline-block;
        }
        .badge-approved { background: #10b981; }
        .badge-pending { background: #f59e0b; color: #000; }
        .badge-rejected { background: #dc2626; }
        .badge-active { background: #10b981; }
        .badge-blocked { background: #dc2626; }
        
        /* Tab Buttons */
        .tab-buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
        .tab-btn {
            background: #111827;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
        }
        .tab-btn.active { background: #2b6ef0; }
        
        /* Hidden elements */
        .service-tab, .join-tab { display: none; }
        .service-tab.active, .join-tab.active { display: block; }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #0d1425;
            border-radius: 20px;
            padding: 24px;
            width: 90%;
            max-width: 450px;
            border: 1px solid #2b6ef0;
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #111827;
            padding: 10px 20px;
            border-radius: 30px;
            z-index: 2000;
            border-left: 3px solid #10b981;
            font-size: 13px;
        }
        
        .menu-toggle { display: none; }
        
        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .admin-sidebar { transform: translateX(-100%); position: fixed; z-index: 200; }
            .admin-sidebar.open { transform: translateX(0); }
            .admin-main { margin-left: 0; }
            .menu-toggle { display: block; position: fixed; top: 15px; left: 15px; z-index: 150; background: #2b6ef0; padding: 10px; border-radius: 50%; cursor: pointer; }
        }
    </style>
</head>
<body>
<div class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></div>
<div class="admin-container">
    <div class="admin-sidebar" id="adminSidebar">
        <div style="text-align:center; margin-bottom: 25px;">
            <i class="fas fa-crown" style="font-size: 32px; color: #2b6ef0;"></i>
            <h3 style="margin-top: 8px;">MTS Admin</h3>
        </div>
        <div>
            <button class="admin-nav-btn" data-section="dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</button>
            <button class="admin-nav-btn" data-section="users"><i class="fas fa-users"></i> Users</button>
            <button class="admin-nav-btn" data-section="orders"><i class="fas fa-shopping-cart"></i> Orders</button>
            <button class="admin-nav-btn" data-section="services"><i class="fas fa-cogs"></i> Services</button>
            <button class="admin-nav-btn" data-section="payment-methods"><i class="fas fa-credit-card"></i> Payments</button>
            <button class="admin-nav-btn" data-section="join-requests"><i class="fas fa-user-plus"></i> Join Requests</button>
            <button class="admin-nav-btn" data-section="attendance"><i class="fas fa-calendar-check"></i> Attendance</button>
            <button class="admin-nav-btn" data-section="jobs"><i class="fas fa-briefcase"></i> Jobs</button>
            <button class="admin-nav-btn" data-section="funds"><i class="fas fa-money-bill-wave"></i> Fund Requests</button>
            <button class="admin-nav-btn" data-section="admins"><i class="fas fa-user-shield"></i> Settings</button>
            <button class="admin-nav-btn" id="adminLogoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </div>
    <div class="admin-main" id="adminMain">
        <div id="loginScreen" style="max-width: 400px; margin: 100px auto; background: #0d1425; border-radius: 20px; padding: 30px; border: 1px solid #1e293b;">
            <div style="text-align:center; margin-bottom: 20px;">
                <i class="fas fa-lock" style="font-size: 40px; color: #2b6ef0;"></i>
                <h2 style="margin-top: 10px;">Admin Login</h2>
            </div>
            <input type="text" id="adminEmail" placeholder="Email" value="admin@mts.com">
            <input type="password" id="adminPassword" placeholder="Password" value="Admin@123">
            <button id="adminLoginBtn" class="btn" style="width:100%; margin-top:15px;">Login</button>
        </div>
        <div id="adminContent" style="display: none;">
            <div class="stats-grid" id="statsCards"></div>
            <div id="dynamicContent"></div>
        </div>
    </div>
</div>

<div id="paymentModal" class="modal-overlay">
    <div class="modal-content">
        <h3 id="modalTitle">Add Payment Method</h3>
        <input type="hidden" id="pmId">
        <input type="text" id="pmName" placeholder="Name (e.g., Easypaisa)">
        <input type="text" id="pmAccount" placeholder="Account Number">
        <input type="text" id="pmHolder" placeholder="Account Holder">
        <div style="display:flex; gap:10px; margin-top:15px;">
            <button class="btn btn-success" onclick="savePaymentMethod()">Save</button>
            <button class="btn" onclick="closePaymentModal()">Cancel</button>
        </div>
    </div>
</div>

<script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzXvgaj06YviIbHlKvM7FmLH6y_FvYG6kcBv9TgVuelbNp6sjm187ABRnXFTlPM4e_-Jg/exec";
    
    let adminToken = localStorage.getItem("adminToken");
    let cachedData = {};
    
    function showToast(msg, isError = false) {
        let toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.borderLeftColor = isError ? '#dc2626' : '#10b981';
        toast.innerHTML = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }
    
    async function api(action, data = {}) {
        try {
            let payload = { action, adminToken, ...data };
            let formData = new FormData();
            formData.append("payload", JSON.stringify(payload));
            let res = await fetch(APPS_SCRIPT_URL, { method: "POST", body: formData });
            let result = await res.json();
            if (!result.success && result.error === 'Please login again') {
                localStorage.removeItem("adminToken");
                adminToken = null;
                document.getElementById("loginScreen").style.display = "block";
                document.getElementById("adminContent").style.display = "none";
            }
            return result;
        } catch(e) {
            return { success: false, error: e.message };
        }
    }
    
    document.getElementById("adminLoginBtn")?.addEventListener("click", async () => {
        let res = await api("adminLogin", { email: document.getElementById("adminEmail").value, password: document.getElementById("adminPassword").value });
        if (res.success) {
            adminToken = res.token;
            localStorage.setItem("adminToken", adminToken);
            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("adminContent").style.display = "block";
            showToast("Login successful!");
            loadDashboard();
        } else showToast(res.error || "Login failed", true);
    });
    
    document.getElementById("adminLogoutBtn")?.addEventListener("click", () => {
        localStorage.removeItem("adminToken");
        location.reload();
    });
    
    document.querySelectorAll(".admin-nav-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            document.querySelectorAll(".admin-nav-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            let section = btn.getAttribute("data-section");
            if (section) loadSection(section);
            if (window.innerWidth <= 768) document.getElementById("adminSidebar").classList.remove("open");
        });
    });
    
    document.getElementById("menuToggle")?.addEventListener("click", () => {
        document.getElementById("adminSidebar").classList.toggle("open");
    });
    
    async function loadSection(section) {
        document.getElementById("dynamicContent").innerHTML = '<div style="text-align:center;padding:40px;"><i class="fas fa-spinner fa-spin"></i></div>';
        switch(section) {
            case "dashboard": await loadDashboard(); break;
            case "users": await loadUsers(); break;
            case "orders": await loadOrders(); break;
            case "services": await loadServices(); break;
            case "payment-methods": await loadPaymentMethods(); break;
            case "join-requests": await loadJoinRequests(); break;
            case "attendance": await loadAttendance(); break;
            case "jobs": await loadJobs(); break;
            case "funds": await loadFundRequests(); break;
            case "admins": await loadAdminSettings(); break;
        }
    }
    
    async function loadDashboard() {
        let stats = await api("adminGetStats");
        if (stats.success) {
            document.getElementById("statsCards").innerHTML = `
                <div class="stat-card"><i class="fas fa-users"></i><h2>${stats.totalUsers || 0}</h2><p>Total Users</p></div>
                <div class="stat-card"><i class="fas fa-shopping-cart"></i><h2>${stats.totalOrders || 0}</h2><p>Total Orders</p></div>
                <div class="stat-card"><i class="fas fa-rupee-sign"></i><h2>₨ ${stats.totalRevenue || 0}</h2><p>Revenue</p></div>
                <div class="stat-card"><i class="fas fa-clock"></i><h2>${stats.pendingOrders || 0}</h2><p>Pending Orders</p></div>
            `;
            document.getElementById("dynamicContent").innerHTML = '<div style="text-align:center;padding:40px;"><i class="fas fa-chart-line" style="font-size:40px;color:#2b6ef0;"></i><p style="margin-top:15px;">Welcome to Admin Dashboard</p></div>';
        }
    }
    
    async function loadUsers() {
        let res = await api("adminGetAllUsers");
        if (!res.success) { document.getElementById("dynamicContent").innerHTML = '<p>Failed to load</p>'; return; }
        let users = res.users || [];
        let html = `<h3><i class="fas fa-users"></i> Users (${users.length})</h3><div class="cards-grid">`;
        users.forEach(u => {
            html += `
                <div class="data-card">
                    <div class="card-header"><i class="fas fa-user"></i> ${u.fullName}</div>
                    <div class="card-body">
                        <div class="card-item"><span class="card-label">User ID</span><span class="card-value">${u.userId}</span></div>
                        <div class="card-item"><span class="card-label">Email</span><span class="card-value">${u.gmail}</span></div>
                        <div class="card-item"><span class="card-label">Phone</span><span class="card-value">${u.phone || '-'}</span></div>
                        <div class="card-item"><span class="card-label">Wallet</span><span class="card-value">₨ ${u.wallet}</span></div>
                        <div class="card-item"><span class="card-label">Type</span><span class="card-value">${u.userType}</span></div>
                        <div class="card-item"><span class="card-label">Status</span><span class="card-value"><span class="badge ${u.blocked ? 'badge-blocked' : 'badge-active'}">${u.blocked ? 'Blocked' : 'Active'}</span></span></div>
                        <div class="card-item"><span class="card-label">Actions</span>
                            <span><button class="btn btn-sm ${u.blocked ? 'btn-success' : 'btn-danger'}" onclick="toggleUserBlock('${u.userId}', ${!u.blocked})">${u.blocked ? 'Unblock' : 'Block'}</button>
                            <button class="btn btn-sm btn-warning" onclick="changeUserPass('${u.userId}')">Change Pass</button></span>
                        </div>
                    </div>
                </div>`;
        });
        html += `</div>`;
        document.getElementById("dynamicContent").innerHTML = html;
    }
    
    window.toggleUserBlock = async (id, block) => { await api("adminToggleBlockUser", { userId: id, block }); loadUsers(); };
    window.changeUserPass = async (id) => { let p = prompt("New password:"); if(p) await api("adminChangePassword", { userId: id, newPassword: p }); loadUsers(); };
    
    async function loadOrders() {
        let res = await api("adminGetAllOrders");
        if (!res.success) { document.getElementById("dynamicContent").innerHTML = '<p>Failed to load</p>'; return; }
        let orders = res.orders || [];
        let html = `<h3><i class="fas fa-shopping-cart"></i> Orders (${orders.length})</h3><div class="cards-grid">`;
        orders.forEach(o => {
            html += `
                <div class="data-card">
                    <div class="card-header"><i class="fas fa-tag"></i> ${o.orderId}</div>
                    <div class="card-body">
                        <div class="card-item"><span class="card-label">User</span><span class="card-value">${o.userName}</span></div>
                        <div class="card-item"><span class="card-label">Service</span><span class="card-value">${o.serviceName}</span></div>
                        <div class="card-item"><span class="card-label">Quantity</span><span class="card-value">${o.qty}</span></div>
                        <div class="card-item"><span class="card-label">Amount</span><span class="card-value">₨ ${o.amount}</span></div>
                        <div class="card-item"><span class="card-label">Status</span>
                            <span><select id="status_${o.orderId}" style="width:120px;padding:4px 8px;">${['Pending','In Progress','Completed','Cancelled','Refunded'].map(s => `<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select>
                            <button class="btn btn-sm" onclick="updateOrderStatus('${o.orderId}')">Update</button></span>
                        </div>
                    </div>
                </div>`;
        });
        html += `</div>`;
        document.getElementById("dynamicContent").innerHTML = html;
    }
    
    window.updateOrderStatus = async (id) => { await api("adminUpdateOrderStatus", { orderId: id, status: document.getElementById(`status_${id}`).value }); showToast("Updated"); loadOrders(); };
    
    async function loadServices() {
        let res = await api("adminGetServices");
        let services = res.services || [];
        let html = `
            <h3><i class="fas fa-cogs"></i> Services (${services.length})</h3>
            <div class="tab-buttons"><button class="tab-btn active" onclick="showTab('add')">Add</button><button class="tab-btn" onclick="showTab('list')">List</button><button class="tab-btn" onclick="showTab('edit')">Edit</button><button class="tab-btn" onclick="showTab('delete')">Delete</button></div>
            <div id="addTab" class="service-tab active"><div class="data-card"><div class="card-header">Add Service</div><div class="card-body"><input id="servName" placeholder="Name"><input id="servPlatform" placeholder="Platform"><input id="servRate" type="number" placeholder="Rate (PKR)"><div class="form-row" style="display:flex;gap:10px;"><input id="servMin" placeholder="Min"><input id="servMax" placeholder="Max"></div><textarea id="servDesc" placeholder="Description" rows="2"></textarea><label><input type="checkbox" id="servPer1k"> Per 1k</label><button class="btn btn-success" onclick="addService()">Save</button></div></div></div>
            <div id="listTab" class="service-tab"><div class="cards-grid">${services.map(s => `<div class="data-card"><div class="card-header">${s.Name}</div><div class="card-body"><div class="card-item"><span class="card-label">Platform</span><span>${s.Platform}</span></div><div class="card-item"><span class="card-label">Rate</span><span>₨ ${s.Rate} ${s.Per1k ? '/1000' : '/unit'}</span></div><div class="card-item"><span class="card-label">Min/Max</span><span>${s.MinQty} - ${s.MaxQty}</span></div></div></div>`).join('')}</div></div>
            <div id="editTab" class="service-tab"><div class="data-card"><div class="card-header">Edit Service</div><div class="card-body"><select id="editServiceSelect">${services.map(s => `<option value="${s.ServiceId}">${s.Name}</option>`).join('')}</select><div id="editFields"></div><button class="btn btn-warning" onclick="updateService()">Update</button></div></div></div>
            <div id="deleteTab" class="service-tab"><div class="data-card"><div class="card-header">Delete Service</div><div class="card-body"><select id="deleteServiceSelect">${services.map(s => `<option value="${s.ServiceId}">${s.Name}</option>`).join('')}</select><button class="btn btn-danger" onclick="deleteService()">Delete</button></div></div></div>`;
        document.getElementById("dynamicContent").innerHTML = html;
        document.getElementById("editServiceSelect")?.addEventListener("change", (e) => {
            let s = services.find(s => s.ServiceId === e.target.value);
            if(s) document.getElementById("editFields").innerHTML = `<input id="editName" value="${s.Name}"><input id="editRate" value="${s.Rate}"><input id="editMin" value="${s.MinQty}"><input id="editMax" value="${s.MaxQty}"><textarea id="editDesc">${s.Description || ''}</textarea>`;
        });
    }
    
    window.showTab = (tab) => { document.querySelectorAll('.service-tab').forEach(t => t.classList.remove('active')); document.getElementById(`${tab}Tab`).classList.add('active'); };
    window.addService = async () => { await api("adminAddService", { name: document.getElementById("servName").value, platform: document.getElementById("servPlatform").value, rate: parseFloat(document.getElementById("servRate").value), minQty: parseInt(document.getElementById("servMin").value)||1, maxQty: parseInt(document.getElementById("servMax").value)||10000, description: document.getElementById("servDesc").value, per1k: document.getElementById("servPer1k").checked }); showToast("Added"); loadServices(); };
    window.updateService = async () => { await api("adminEditService", { serviceId: document.getElementById("editServiceSelect").value, name: document.getElementById("editName").value, rate: parseFloat(document.getElementById("editRate").value), minQty: parseInt(document.getElementById("editMin").value), maxQty: parseInt(document.getElementById("editMax").value), description: document.getElementById("editDesc").value }); showToast("Updated"); loadServices(); };
    window.deleteService = async () => { if(confirm("Delete?")) { await api("adminDeleteService", { serviceId: document.getElementById("deleteServiceSelect").value }); showToast("Deleted"); loadServices(); } };
    
    async function loadPaymentMethods() {
        let res = await api("getPaymentMethods");
        let methods = res.methods || [];
        let html = `<h3><i class="fas fa-credit-card"></i> Payment Methods</h3><button class="btn btn-success" onclick="openAddPayment()">+ Add New</button><div class="cards-grid" style="margin-top:16px;">`;
        methods.forEach(m => {
            html += `<div class="data-card"><div class="card-header"><i class="${m.Icon || 'fas fa-credit-card'}"></i> ${m.Name}</div><div class="card-body"><div class="card-item"><span class="card-label">Account</span><span>${m.Account}</span></div><div class="card-item"><span class="card-label">Holder</span><span>${m.Holder}</span></div><div class="card-item"><span class="card-label">Actions</span><span><button class="btn btn-sm btn-info" onclick="editPayment('${m.Id}','${m.Name}','${m.Account}','${m.Holder}')">Edit</button><button class="btn btn-sm btn-danger" onclick="deletePayment('${m.Id}')">Delete</button></span></div></div></div>`;
        });
        html += `</div>`;
        document.getElementById("dynamicContent").innerHTML = html;
    }
    
    window.openAddPayment = () => { document.getElementById("modalTitle").innerText = "Add Payment"; document.getElementById("pmId").value = ""; document.getElementById("pmName").value = ""; document.getElementById("pmAccount").value = ""; document.getElementById("pmHolder").value = ""; document.getElementById("paymentModal").style.display = "flex"; };
    window.editPayment = (id, name, acc, holder) => { document.getElementById("modalTitle").innerText = "Edit Payment"; document.getElementById("pmId").value = id; document.getElementById("pmName").value = name; document.getElementById("pmAccount").value = acc; document.getElementById("pmHolder").value = holder; document.getElementById("paymentModal").style.display = "flex"; };
    window.savePaymentMethod = async () => { let id = document.getElementById("pmId").value; let data = { name: document.getElementById("pmName").value, account: document.getElementById("pmAccount").value, holder: document.getElementById("pmHolder").value }; let res = id ? await api("adminUpdatePaymentMethod", { id, ...data }) : await api("adminAddPaymentMethod", data); if(res.success) { showToast("Saved"); closePaymentModal(); loadPaymentMethods(); } else showToast(res.error, true); };
    window.deletePayment = async (id) => { if(confirm("Delete?")) { await api("adminDeletePaymentMethod", { id }); showToast("Deleted"); loadPaymentMethods(); } };
    window.closePaymentModal = () => { document.getElementById("paymentModal").style.display = "none"; };
    
    async function loadJoinRequests() {
        let res = await api("adminGetJoinRequests");
        let requests = res.requests || [];
        let html = `<h3><i class="fas fa-user-plus"></i> Join Requests (${requests.length})</h3><div class="cards-grid">`;
        requests.forEach(j => {
            html += `<div class="data-card"><div class="card-header">${j.name}</div><div class="card-body"><div class="card-item"><span class="card-label">Email</span><span>${j.email}</span></div><div class="card-item"><span class="card-label">WhatsApp</span><span>${j.whatsapp || '-'}</span></div><div class="card-item"><span class="card-label">Type/Hours</span><span>${j.salaryType} | ${j.availableHours}h</span></div><div class="card-item"><span class="card-label">Status</span><span class="badge ${j.status==='Approved'?'badge-approved':j.status==='Rejected'?'badge-rejected':'badge-pending'}">${j.status || 'Pending'}</span></div><div class="card-item"><span class="card-label">Salary</span><span><input type="number" id="salary_${j.id}" value="${j.salary || ''}" style="width:100px"><button class="btn btn-sm" onclick="setSalary('${j.id}')">Set</button></span></div><div class="card-item"><span class="card-label">Actions</span><span><button class="btn btn-sm btn-success" onclick="approveJoin('${j.id}')">Approve</button><button class="btn btn-sm btn-danger" onclick="rejectJoin('${j.id}')">Reject</button></span></div></div></div>`;
        });
        html += `</div>`;
        document.getElementById("dynamicContent").innerHTML = html;
    }
    window.setSalary = async (id) => { await api("adminSetJoinSalary", { requestId: id, salary: document.getElementById(`salary_${id}`).value }); showToast("Salary set"); loadJoinRequests(); };
    window.approveJoin = async (id) => { await api("adminApproveJoin", { requestId: id }); showToast("Approved"); loadJoinRequests(); };
    window.rejectJoin = async (id) => { await api("adminRejectJoin", { requestId: id }); showToast("Rejected"); loadJoinRequests(); };
    
    async function loadAttendance() {
        let res = await api("adminGetAllAttendance");
        let list = res.attendance || [];
        let html = `<h3><i class="fas fa-calendar-check"></i> Attendance (${list.length})</h3><div class="cards-grid">`;
        list.forEach(a => {
            html += `<div class="data-card"><div class="card-header">${a.name || '-'}</div><div class="card-body"><div class="card-item"><span class="card-label">Date</span><span>${a.date || '-'}</span></div><div class="card-item"><span class="card-label">Login/Logout</span><span>${a.loginTime || '-'} → ${a.logoutTime || '-'}</span></div><div class="card-item"><span class="card-label">Hours/Work</span><span>${a.workingHours || '-'}h | ${a.workType || '-'}</span></div></div></div>`;
        });
        html += `</div>`;
        document.getElementById("dynamicContent").innerHTML = html;
    }
    
    async function loadJobs() {
        let res = await api("adminGetAllJobs");
        let list = res.jobs || [];
        let html = `<h3><i class="fas fa-briefcase"></i> Jobs (${list.length})</h3><div class="cards-grid">`;
        list.forEach(j => {
            html += `<div class="data-card"><div class="card-header">${j.jobName || '-'}</div><div class="card-body"><div class="card-item"><span class="card-label">User</span><span>${j.userName || '-'}</span></div><div class="card-item"><span class="card-label">Order ID</span><span>${j.orderId || '-'}</span></div><div class="card-item"><span class="card-label">Platform</span><span>${j.platform || '-'}</span></div><div class="card-item"><span class="card-label">Amount</span><span>₨ ${j.amount || '-'}</span></div></div></div>`;
        });
        html += `</div>`;
        document.getElementById("dynamicContent").innerHTML = html;
    }
    
    async function loadFundRequests() {
        let res = await api("adminGetFundRequests");
        let list = res.requests || [];
        let html = `<h3><i class="fas fa-money-bill-wave"></i> Fund Requests (${list.length})</h3><div class="cards-grid">`;
        list.forEach(f => {
            html += `<div class="data-card"><div class="card-header">₨ ${f.Amount || 0}</div><div class="card-body"><div class="card-item"><span class="card-label">Email</span><span>${f.Email || '-'}</span></div><div class="card-item"><span class="card-label">Transaction ID</span><span>${f.TransactionId || '-'}</span></div><div class="card-item"><span class="card-label">Status</span><span class="badge ${f.Status==='Approved'?'badge-approved':'badge-pending'}">${f.Status || 'Pending'}</span></div><div class="card-item"><span class="card-label">Action</span><span>${f.Status !== 'Approved' ? `<button class="btn btn-sm btn-success" onclick="approveFund('${f.RequestId}', ${f.Amount})">Approve</button>` : ''} ${f.Status !== 'Rejected' ? `<button class="btn btn-sm btn-danger" onclick="rejectFund('${f.RequestId}')">Reject</button>` : ''}</span></div></div></div>`;
        });
        html += `</div>`;
        document.getElementById("dynamicContent").innerHTML = html;
    }
    
    window.approveFund = async (id, amt) => { await api("adminApproveFund", { requestId: id, amount: amt }); showToast("Funds added"); loadFundRequests(); };
    window.rejectFund = async (id) => { await api("adminRejectFund", { requestId: id }); showToast("Rejected"); loadFundRequests(); };
    
    async function loadAdminSettings() {
        document.getElementById("dynamicContent").innerHTML = `
            <h3><i class="fas fa-user-shield"></i> Admin Settings</h3>
            <div class="cards-grid">
                <div class="data-card"><div class="card-header">Change Password</div><div class="card-body"><input type="password" id="curPass" placeholder="Current"><input type="password" id="newPass" placeholder="New"><input type="password" id="conPass" placeholder="Confirm"><button class="btn" onclick="changePass()">Update</button></div></div>
                <div class="data-card"><div class="card-header">Add Admin</div><div class="card-body"><input type="email" id="newAdminEmail" placeholder="Email"><input type="password" id="newAdminPass" placeholder="Password"><button class="btn btn-success" onclick="addAdmin()">Add</button></div></div>
            </div>`;
    }
    
    window.changePass = async () => { let np = document.getElementById("newPass").value; let cp = document.getElementById("conPass").value; if(np !== cp) { showToast("Passwords don't match", true); return; } let res = await api("adminChangeOwnPassword", { currentPassword: document.getElementById("curPass").value, newPassword: np }); showToast(res.message || "Updated"); };
    window.addAdmin = async () => { let res = await api("adminAddNewAdmin", { email: document.getElementById("newAdminEmail").value, password: document.getElementById("newAdminPass").value }); showToast(res.message || "Added"); };
    
    if (adminToken) {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("adminContent").style.display = "block";
        loadDashboard();
    }
</script>
</body>
</html>
