<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MTS SMM Admin Panel - Premium Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #0a0f1c; color: #eef2ff; }
        
        /* Premium Sidebar */
        .admin-sidebar {
            width: 280px;
            background: linear-gradient(180deg, rgba(10, 20, 35, 0.98) 0%, rgba(5, 10, 20, 0.98) 100%);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(43, 110, 240, 0.3);
            padding: 25px 15px;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            transition: transform 0.3s ease;
            z-index: 1000;
        }
        
        .admin-sidebar::-webkit-scrollbar { width: 5px; }
        .admin-sidebar::-webkit-scrollbar-track { background: #1e293b; }
        .admin-sidebar::-webkit-scrollbar-thumb { background: #2b6ef0; border-radius: 10px; }
        
        .admin-main {
            flex: 1;
            margin-left: 280px;
            padding: 25px;
            background: radial-gradient(circle at 0% 0%, #0f1625 0%, #0a0f1c 100%);
            min-height: 100vh;
        }
        
        /* Premium Cards */
        .glass-card {
            background: rgba(15, 25, 45, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid rgba(72, 187, 255, 0.2);
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            border-color: rgba(43, 110, 240, 0.5);
            transform: translateY(-3px);
            box-shadow: 0 20px 40px -15px rgba(0,0,0,0.3);
        }
        
        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px,1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: linear-gradient(135deg, rgba(43, 110, 240, 0.15), rgba(16, 185, 129, 0.1));
            border-radius: 24px;
            padding: 20px;
            border: 1px solid rgba(43, 110, 240, 0.3);
            transition: all 0.3s;
        }
        .stat-card:hover { transform: translateY(-5px); border-color: #2b6ef0; }
        .stat-card i { font-size: 40px; margin-bottom: 15px; }
        .stat-card h2 { font-size: 32px; margin: 10px 0; }
        
        /* Buttons */
        .btn {
            background: linear-gradient(90deg, #2b6ef0, #1a4fc1);
            border: none;
            padding: 8px 18px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            margin: 5px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn:hover { transform: translateY(-2px); opacity: 0.9; box-shadow: 0 5px 15px rgba(43,110,240,0.3); }
        .btn-danger { background: linear-gradient(90deg, #dc2626, #b91c1c); }
        .btn-success { background: linear-gradient(90deg, #10b981, #059669); }
        .btn-warning { background: linear-gradient(90deg, #f59e0b, #d97706); }
        .btn-info { background: linear-gradient(90deg, #06b6d4, #0891b2); }
        .btn-outline { background: transparent; border: 1px solid #2b6ef0; }
        
        /* Tables */
        table { width: 100%; border-collapse: collapse; overflow-x: auto; display: block; }
        th, td { padding: 12px; border-bottom: 1px solid #334155; text-align: left; }
        th { background: rgba(43, 110, 240, 0.2); font-weight: 600; }
        tr:hover { background: rgba(43, 110, 240, 0.1); }
        
        /* Tabs */
        .tab-buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .tab-btn { background: #1e293b; padding: 8px 20px; border-radius: 40px; cursor: pointer; transition: all 0.2s; }
        .tab-btn.active { background: #2b6ef0; }
        .tab-btn:hover { background: #3b82f6; }
        
        /* Payment Methods */
        .payment-method-card {
            background: #1e293b;
            border-radius: 16px;
            padding: 15px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-left: 4px solid #10b981;
        }
        .payment-method-card .info { flex: 1; }
        .payment-method-card .actions { display: flex; gap: 8px; }
        
        /* Status Badges */
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; display: inline-block; }
        .status-approved { background: #10b981; color: white; }
        .status-pending { background: #f59e0b; color: black; }
        .status-rejected { background: #dc2626; color: white; }
        .status-progress { background: #3b82f6; color: white; }
        
        /* Navigation */
        .admin-nav-btn {
            background: transparent;
            border: none;
            color: #eef2ff;
            padding: 12px 15px;
            text-align: left;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            width: 100%;
            margin: 2px 0;
        }
        .admin-nav-btn:hover, .admin-nav-btn.active { background: #2b6ef0; }
        .admin-nav-btn i { width: 25px; margin-right: 10px; }
        
        /* Forms */
        .form-row { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 15px; }
        .form-row > * { flex: 1; }
        input, select, textarea { background: #1e293b; border: 1px solid #334155; padding: 12px 16px; border-radius: 20px; color: white; width: 100%; outline: none; transition: all 0.2s; }
        input:focus, select:focus { border-color: #2b6ef0; box-shadow: 0 0 0 2px rgba(43,110,240,0.2); }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1e293b;
            border-radius: 24px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            border: 1px solid #2b6ef0;
        }
        
        .menu-toggle { display: none; }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #1e293b; padding: 12px 20px; border-radius: 40px; z-index: 2000; border-left: 4px solid #10b981; }
        
        @media (max-width: 768px) {
            .admin-sidebar { transform: translateX(-100%); }
            .admin-sidebar.open { transform: translateX(0); }
            .admin-main { margin-left: 0; }
            .menu-toggle { display: block; position: fixed; top: 15px; left: 15px; z-index: 1001; background: #2b6ef0; padding: 12px; border-radius: 50%; cursor: pointer; }
        }
    </style>
</head>
<body>
<div class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></div>
<div class="admin-container" style="display: flex; min-height: 100vh;">
    <div class="admin-sidebar" id="adminSidebar">
        <div style="text-align: center; margin-bottom: 30px;">
            <i class="fas fa-crown" style="font-size: 40px; color: #2b6ef0;"></i>
            <h2 style="margin-top: 10px;">MTS Admin</h2>
            <p style="font-size: 12px; color: #94a3b8;">Premium Dashboard</p>
        </div>
        <div style="display: flex; flex-direction: column; gap: 5px;">
            <button class="admin-nav-btn" data-section="dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</button>
            <button class="admin-nav-btn" data-section="users"><i class="fas fa-users"></i> Users</button>
            <button class="admin-nav-btn" data-section="orders"><i class="fas fa-shopping-cart"></i> Orders</button>
            <button class="admin-nav-btn" data-section="services"><i class="fas fa-cogs"></i> Services</button>
            <button class="admin-nav-btn" data-section="payment-methods"><i class="fas fa-credit-card"></i> Payment Methods</button>
            <button class="admin-nav-btn" data-section="join-requests"><i class="fas fa-user-plus"></i> Join Requests</button>
            <button class="admin-nav-btn" data-section="attendance"><i class="fas fa-calendar-check"></i> Attendance</button>
            <button class="admin-nav-btn" data-section="jobs"><i class="fas fa-briefcase"></i> Job Details</button>
            <button class="admin-nav-btn" data-section="recommendations"><i class="fas fa-star"></i> Recommendations</button>
            <button class="admin-nav-btn" data-section="help"><i class="fas fa-headset"></i> Help Tickets</button>
            <button class="admin-nav-btn" data-section="funds"><i class="fas fa-money-bill-wave"></i> Fund Requests</button>
            <button class="admin-nav-btn" data-section="admins"><i class="fas fa-user-shield"></i> Admin Settings</button>
            <button class="admin-nav-btn" id="adminLogoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </div>
    <div class="admin-main" id="adminMain">
        <div id="loginScreen" class="glass-card" style="max-width: 450px; margin: 80px auto;">
            <div style="text-align:center; margin-bottom: 20px;">
                <i class="fas fa-lock" style="font-size: 50px; color: #2b6ef0;"></i>
                <h2 style="margin-top: 10px;">Admin Login</h2>
            </div>
            <input type="text" id="adminEmail" placeholder="Admin Email" value="admin@mts.com">
            <input type="password" id="adminPassword" placeholder="Password" value="Admin@123">
            <button id="adminLoginBtn" class="btn" style="width:100%; margin-top:15px;">Login</button>
        </div>
        <div id="adminContent" style="display: none;">
            <div class="stats-grid" id="statsCards"></div>
            <div class="glass-card">
                <div id="dynamicContent">Select a section from the sidebar</div>
            </div>
        </div>
    </div>
</div>

<!-- Payment Method Modal -->
<div id="paymentMethodModal" class="modal-overlay">
    <div class="modal-content">
        <h3 id="modalTitle">Add Payment Method</h3>
        <input type="hidden" id="paymentMethodId">
        <input type="text" id="pmName" placeholder="Payment Method Name (e.g., Easypaisa)">
        <input type="text" id="pmAccount" placeholder="Account Number">
        <input type="text" id="pmHolder" placeholder="Account Holder Name">
        <input type="text" id="pmIcon" placeholder="Icon Class (e.g., fas fa-mobile-alt)" value="fas fa-credit-card">
        <div class="form-row" style="margin-top: 15px;">
            <button class="btn btn-success" onclick="savePaymentMethod()">Save</button>
            <button class="btn btn-secondary" onclick="closePaymentModal()">Cancel</button>
        </div>
    </div>
</div>

<script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzXvgaj06YviIbHlKvM7FmLH6y_FvYG6kcBv9TgVuelbNp6sjm187ABRnXFTlPM4e_-Jg/exec";
    
    let adminToken = localStorage.getItem("adminToken");
    let paymentMethods = [];
    
    function showToast(message, isError = false) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.borderLeftColor = isError ? '#dc2626' : '#10b981';
        toast.innerHTML = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
    
    async function adminApiCall(action, data = {}) {
        try {
            const payload = { action, adminToken, ...data };
            const formData = new FormData();
            formData.append("payload", JSON.stringify(payload));
            const res = await fetch(APPS_SCRIPT_URL, { method: "POST", body: formData });
            const text = await res.text();
            const result = JSON.parse(text);
            if (!result.success && result.error === 'Please login again') {
                localStorage.removeItem("adminToken");
                adminToken = null;
                document.getElementById("loginScreen").style.display = "block";
                document.getElementById("adminContent").style.display = "none";
                showToast("Session expired. Please login again.", true);
            }
            return result;
        } catch(err) {
            showToast("Connection error: " + err.message, true);
            return { success: false, error: err.message };
        }
    }
    
    document.getElementById("adminLoginBtn")?.addEventListener("click", async () => {
        const email = document.getElementById("adminEmail").value;
        const password = document.getElementById("adminPassword").value;
        const res = await adminApiCall("adminLogin", { email, password });
        if (res.success) {
            adminToken = res.token;
            localStorage.setItem("adminToken", adminToken);
            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("adminContent").style.display = "block";
            showToast("Login successful!");
            loadDashboard();
        } else {
            showToast(res.error || "Login failed", true);
        }
    });
    
    document.getElementById("adminLogoutBtn")?.addEventListener("click", () => {
        localStorage.removeItem("adminToken");
        adminToken = null;
        location.reload();
    });
    
    document.querySelectorAll(".admin-nav-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            document.querySelectorAll(".admin-nav-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            const section = btn.getAttribute("data-section");
            if (section) loadSection(section);
            if (window.innerWidth <= 768) document.getElementById("adminSidebar").classList.remove("open");
        });
    });
    
    document.getElementById("menuToggle")?.addEventListener("click", () => {
        document.getElementById("adminSidebar").classList.toggle("open");
    });
    
    async function loadSection(section) {
        document.getElementById("dynamicContent").innerHTML = '<div style="text-align:center;padding:40px;"><i class="fas fa-spinner fa-spin" style="font-size:40px;"></i></div>';
        switch(section) {
            case "dashboard": await loadDashboard(); break;
            case "users": await loadUsers(); break;
            case "orders": await loadOrders(); break;
            case "services": await loadServices(); break;
            case "payment-methods": await loadPaymentMethods(); break;
            case "join-requests": await loadJoinRequests(); break;
            case "attendance": await loadAttendance(); break;
            case "jobs": await loadJobs(); break;
            case "recommendations": await loadRecommendations(); break;
            case "help": await loadHelpTickets(); break;
            case "funds": await loadFundRequests(); break;
            case "admins": await loadAdminSettings(); break;
        }
    }
    
    async function loadDashboard() {
        const stats = await adminApiCall("adminGetStats");
        if (stats.success) {
            document.getElementById("statsCards").innerHTML = `
                <div class="stat-card"><i class="fas fa-users"></i><h2>${stats.totalUsers || 0}</h2><p>Total Users</p></div>
                <div class="stat-card"><i class="fas fa-shopping-cart"></i><h2>${stats.totalOrders || 0}</h2><p>Total Orders</p></div>
                <div class="stat-card"><i class="fas fa-rupee-sign"></i><h2>₨ ${stats.totalRevenue || 0}</h2><p>Revenue (PKR)</p></div>
                <div class="stat-card"><i class="fas fa-clock"></i><h2>${stats.pendingOrders || 0}</h2><p>Pending Orders</p></div>
            `;
            document.getElementById("dynamicContent").innerHTML = '<div style="text-align:center; padding:40px;"><i class="fas fa-chart-line" style="font-size:50px; color:#2b6ef0;"></i><p style="margin-top:15px;">Welcome to MTS Admin Dashboard. Select options from the sidebar to manage your platform.</p></div>';
        }
    }
    
    async function loadUsers() {
        const res = await adminApiCall("adminGetAllUsers");
        if (!res.success) { document.getElementById("dynamicContent").innerHTML = '<p>Failed to load users</p>'; return; }
        let html = `<h3><i class="fas fa-users"></i> User Management (${res.users?.length || 0} users)</h3><div style="overflow-x:auto;">表格<thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Wallet</th><th>Type</th><th>Status</th><th>Actions</th></tr></thead><tbody>`;
        (res.users || []).forEach(u => {
            html += `<tr>
                <td>${u.userId}</td><td>${u.fullName}</td><td>${u.gmail}</td><td>${u.phone || '-'}</td><td>₨ ${u.wallet}</td><td>${u.userType}</td>
                <td><span class="status-badge ${u.blocked ? 'status-pending' : 'status-approved'}">${u.blocked ? 'Blocked' : 'Active'}</span></td>
                <td><button class="btn" onclick="toggleUserBlock('${u.userId}', ${!u.blocked})">${u.blocked ? 'Unblock' : 'Block'}</button>
                    <button class="btn btn-info" onclick="changeUserPass('${u.userId}')">Change Pass</button>
                </tr>`;
        });
        html += `</tbody>得到</div>`;
        document.getElementById("dynamicContent").innerHTML = html;
    }
    
    window.toggleUserBlock = async (userId, block) => { await adminApiCall("adminToggleBlockUser", { userId, block }); loadUsers(); };
    window.changeUserPass = async (userId) => { let newPass = prompt("New password:"); if(newPass) await adminApiCall("adminChangePassword", { userId, newPassword: newPass }); loadUsers(); };
    
    async function loadOrders() {
        const res = await adminApiCall("adminGetAllOrders");
        if (!res.success) { document.getElementById("dynamicContent").innerHTML = '<p>Failed to load orders</p>'; return; }
        let html = `<h3><i class="fas fa-shopping-cart"></i> Order Management (${res.orders?.length || 0} orders)</h3><div style="overflow-x:auto;">表格<thead><tr><th>Order ID</th><th>User</th><th>Service</th><th>Qty</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead><tbody>`;
        (res.orders || []).forEach(o => {
            html += `<tr>
                <td>${o.orderId}</td><td>${o.userName}</td><td>${o.serviceName}</td><td>${o.qty}</td><td>₨ ${o.amount}</td>
                <td><select id="status_${o.orderId}" class="status-select">
                        <option ${o.status==='Pending'?'selected':''}>Pending</option>
                        <option ${o.status==='In Progress'?'selected':''}>In Progress</option>
                        <option ${o.status==='Completed'?'selected':''}>Completed</option>
                        <option ${o.status==='Partially Completed'?'selected':''}>Partially Completed</option>
                        <option ${o.status==='Cancelled'?'selected':''}>Cancelled</option>
                        <option ${o.status==='Refunded'?'selected':''}>Refunded</option>
                    </select></td>
                <td><button class="btn" onclick="updateOrderStatus('${o.orderId}')">Update</button></tr>`;
        });
        html += `</tbody>得到</div>`;
        document.getElementById("dynamicContent").innerHTML = html;
    }
    
    window.updateOrderStatus = async (orderId) => {
        const select = document.getElementById(`status_${orderId}`);
        await adminApiCall("adminUpdateOrderStatus", { orderId, status: select.value });
        showToast("Order status updated");
        loadOrders();
    };
    
    async function loadServices() {
        const res = await adminApiCall("adminGetServices");
        const services = res.services || [];
        let html = `
            <h3><i class="fas fa-cogs"></i> Service Management (${services.length} services)</h3>
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="showServiceTab('add')">➕ Add Service</button>
                <button class="tab-btn" onclick="showServiceTab('list')">📋 Service List</button>
                <button class="tab-btn" onclick="showServiceTab('edit')">✏️ Edit Service</button>
                <button class="tab-btn" onclick="showServiceTab('delete')">🗑️ Delete Service</button>
            </div>
            <div id="addServiceTab" class="service-tab active">
                <h4>Add New Service</h4>
                <div class="form-row"><input id="servName" placeholder="Service Name"><input id="servPlatform" placeholder="Platform"></div>
                <div class="form-row"><input id="servRate" type="number" placeholder="Rate (PKR)"><input id="servMin" type="number" placeholder="Min Qty"><input id="servMax" type="number" placeholder="Max Qty"></div>
                <div class="form-row"><input id="servDelivery" placeholder="Delivery Time"><textarea id="servDesc" placeholder="Description" rows="2"></textarea></div>
                <div><label><input type="checkbox" id="servPer1k"> Per 1k</label> <label><input type="checkbox" id="servIsAccount"> Is Account</label> <label><input type="checkbox" id="servRequireLink"> Require Link</label> <label><input type="checkbox" id="servCustomComments"> Custom Comments</label></div>
                <button class="btn btn-success" onclick="addService()">Save Service</button>
            </div>
            <div id="listServiceTab" class="service-tab" style="display:none;"><h4>All Services</h4><div id="servicesList"></div></div>
            <div id="editServiceTab" class="service-tab" style="display:none;"><h4>Edit Service</h4><select id="editServiceSelect">${services.map(s => `<option value="${s.ServiceId}">${s.Name} (${s.Platform})</option>`).join('')}</select><div id="editFields"></div><button class="btn btn-warning" onclick="updateService()">Update Service</button></div>
            <div id="deleteServiceTab" class="service-tab" style="display:none;"><h4>Delete Service</h4><select id="deleteServiceSelect">${services.map(s => `<option value="${s.ServiceId}">${s.Name} (${s.Platform})</option>`).join('')}</select><button class="btn btn-danger" onclick="deleteService()">Delete Permanently</button></div>`;
        document.getElementById("dynamicContent").innerHTML = html;
        document.getElementById("servicesList").innerHTML = services.map(s => `<div class="detail-card"><strong>${s.Name}</strong> - ${s.Platform}<br>Rate: ₨ ${s.Rate} ${s.Per1k ? '/1000' : '/unit'}<br>Min: ${s.MinQty} | Max: ${s.MaxQty}</div>`).join('');
        
        document.getElementById("editServiceSelect")?.addEventListener("change", (e) => {
            const svc = services.find(s => s.ServiceId === e.target.value);
            if(svc) document.getElementById("editFields").innerHTML = `<input id="editName" value="${svc.Name}"><input id="editRate" value="${svc.Rate}"><input id="editMin" value="${svc.MinQty}"><input id="editMax" value="${svc.MaxQty}"><input id="editDelivery" value="${svc.DeliveryTime}"><textarea id="editDesc">${svc.Description || ''}</textarea>`;
        });
    }
    
    window.showServiceTab = (tab) => { document.querySelectorAll('.service-tab').forEach(t => t.style.display = 'none'); document.getElementById(`${tab}ServiceTab`).style.display = 'block'; };
    window.addService = async () => { await adminApiCall("adminAddService", { name: document.getElementById("servName").value, platform: document.getElementById("servPlatform").value, rate: parseFloat(document.getElementById("servRate").value), minQty: parseInt(document.getElementById("servMin").value), maxQty: parseInt(document.getElementById("servMax").value), deliveryTime: document.getElementById("servDelivery").value, description: document.getElementById("servDesc").value, per1k: document.getElementById("servPer1k").checked, isAccount: document.getElementById("servIsAccount").checked, requireLink: document.getElementById("servRequireLink").checked, customComments: document.getElementById("servCustomComments").checked }); showToast("Service added"); loadServices(); };
    window.updateService = async () => { await adminApiCall("adminEditService", { serviceId: document.getElementById("editServiceSelect").value, name: document.getElementById("editName").value, rate: parseFloat(document.getElementById("editRate").value), minQty: parseInt(document.getElementById("editMin").value), maxQty: parseInt(document.getElementById("editMax").value), deliveryTime: document.getElementById("editDelivery").value, description: document.getElementById("editDesc").value }); showToast("Service updated"); loadServices(); };
    window.deleteService = async () => { if(confirm("Delete?")) { await adminApiCall("adminDeleteService", { serviceId: document.getElementById("deleteServiceSelect").value }); showToast("Service deleted"); loadServices(); } };
    
    // PAYMENT METHODS MANAGEMENT
    async function loadPaymentMethods() {
        const res = await adminApiCall("getPaymentMethods");
        paymentMethods = res.methods || [];
        let html = `
            <h3><i class="fas fa-credit-card"></i> Payment Methods Management</h3>
            <button class="btn btn-success" onclick="openAddPaymentModal()"><i class="fas fa-plus"></i> Add Payment Method</button>
            <div style="margin-top: 20px;">
                ${paymentMethods.map(p => `
                    <div class="payment-method-card">
                        <div class="info">
                            <i class="${p.Icon || 'fas fa-credit-card'}" style="font-size: 24px; margin-right: 10px;"></i>
                            <strong>${p.Name}</strong><br>
                            Account: ${p.Account}<br>
                            Holder: ${p.Holder}
                        </div>
                        <div class="actions">
                            <button class="btn btn-info" onclick="editPaymentMethod('${p.Id}')"><i class="fas fa-edit"></i> Edit</button>
                            <button class="btn btn-danger" onclick="deletePaymentMethod('${p.Id}')"><i class="fas fa-trash"></i> Delete</button>
                        </div>
                    </div>
                `).join('') || '<p>No payment methods found. Click "Add Payment Method" to create one.</p>'}
            </div>
        `;
        document.getElementById("dynamicContent").innerHTML = html;
    }
    
    function openAddPaymentModal() {
        document.getElementById("modalTitle").innerText = "Add Payment Method";
        document.getElementById("paymentMethodId").value = "";
        document.getElementById("pmName").value = "";
        document.getElementById("pmAccount").value = "";
        document.getElementById("pmHolder").value = "";
        document.getElementById("pmIcon").value = "fas fa-credit-card";
        document.getElementById("paymentMethodModal").style.display = "flex";
    }
    
    window.editPaymentMethod = (id) => {
        const method = paymentMethods.find(p => p.Id === id);
        if (method) {
            document.getElementById("modalTitle").innerText = "Edit Payment Method";
            document.getElementById("paymentMethodId").value = method.Id;
            document.getElementById("pmName").value = method.Name;
            document.getElementById("pmAccount").value = method.Account;
            document.getElementById("pmHolder").value = method.Holder;
            document.getElementById("pmIcon").value = method.Icon || "fas fa-credit-card";
            document.getElementById("paymentMethodModal").style.display = "flex";
        }
    };
    
    window.savePaymentMethod = async () => {
        const id = document.getElementById("paymentMethodId").value;
        const data = {
            name: document.getElementById("pmName").value,
            account: document.getElementById("pmAccount").value,
            holder: document.getElementById("pmHolder").value,
            icon: document.getElementById("pmIcon").value
        };
        let res;
        if (id) {
            data.id = id;
            res = await adminApiCall("adminUpdatePaymentMethod", data);
        } else {
            res = await adminApiCall("adminAddPaymentMethod", data);
        }
        if (res.success) {
            showToast(res.message);
            closePaymentModal();
            loadPaymentMethods();
        } else {
            showToast(res.error || "Failed", true);
        }
    };
    
    window.deletePaymentMethod = async (id) => {
        if (confirm("Are you sure you want to delete this payment method?")) {
            const res = await adminApiCall("adminDeletePaymentMethod", { id });
            if (res.success) {
                showToast("Payment method deleted");
                loadPaymentMethods();
            } else {
                showToast(res.error || "Failed to delete", true);
            }
        }
    };
    
    function closePaymentModal() {
        document.getElementById("paymentMethodModal").style.display = "none";
    }
    
    async function loadJoinRequests() {
        const res = await adminApiCall("adminGetJoinRequests");
        let html = `<h3><i class="fas fa-user-plus"></i> Join Requests</h3><div style="overflow-x:auto;">表格<thead><tr><th>Name</th><th>Email</th><th>WhatsApp</th><th>Type</th><th>Hours</th><th>Status</th><th>Salary</th><th>Actions</th></tr></thead><tbody>`;
        (res.requests || []).forEach(j => {
            html += `<tr><td>${j.name}</td><td>${j.email}</td><td>${j.whatsapp || '-'}</td><td>${j.salaryType}</td><td>${j.availableHours}</td>
            <td><span class="status-badge ${j.status==='Approved'?'status-approved':j.status==='Rejected'?'status-rejected':'status-pending'}">${j.status || 'Pending'}</span></td>
            <td><input type="number" id="salary_${j.id}" value="${j.salary || ''}" style="width:100px"><button class="btn" onclick="setSalary('${j.id}')">Set</button></td>
            <td><button class="btn btn-success" onclick="approveJoin('${j.id}')">Approve</button><button class="btn btn-danger" onclick="rejectJoin('${j.id}')">Reject</button></tr>`;
        });
        html += `</tbody>得到</div>`;
        document.getElementById("dynamicContent").innerHTML = html;
    }
    
    window.setSalary = async (id) => { await adminApiCall("adminSetJoinSalary", { requestId: id, salary: document.getElementById(`salary_${id}`).value }); showToast("Salary set"); loadJoinRequests(); };
    window.approveJoin = async (id) => { await adminApiCall("adminApproveJoin", { requestId: id }); showToast("Approved"); loadJoinRequests(); };
    window.rejectJoin = async (id) => { await adminApiCall("adminRejectJoin", { requestId: id }); showToast("Rejected"); loadJoinRequests(); };
    
    async function loadAttendance() {
        const res = await adminApiCall("adminGetAllAttendance");
        let html = `<h3><i class="fas fa-calendar-check"></i> Attendance Records</h3><div style="overflow-x:auto;">表格<thead><tr><th>Date</th><th>Name</th><th>Email</th><th>Login Time</th><th>Logout Time</th><th>Hours</th><th>Work Type</th></tr></thead><tbody>`;
        (res.attendance || []).forEach(a => {
            html += `<tr>
                <td>${a.date || '-'}</td>
                <td>${a.name || '-'}</td>
                <td>${a.email || '-'}</td>
                <td>${a.loginTime || '-'}</td>
                <td>${a.logoutTime || '-'}</td>
                <td>${a.workingHours || '-'}</td>
                <td>${a.workType || '-'}</td>
            </tr>`;
        });
        html += `</tbody>得到</div>`;
        document.getElementById("dynamicContent").innerHTML = html;
    }
    
    async function loadJobs() {
        const res = await adminApiCall("adminGetAllJobs");
        let html = `<h3><i class="fas fa-briefcase"></i> Job Details</h3><div style="overflow-x:auto;">表格<thead><tr><th>Date</th><th>User</th><th>Job Name</th><th>Order ID</th><th>Platform</th><th>Amount</th><tr></thead><tbody>`;
        (res.jobs || []).forEach(j => {
            html += `<tr>
                <td>${j.date || '-'}</td>
                <td>${j.userName || '-'}</td>
                <td>${j.jobName || '-'}</td>
                <td>${j.orderId || '-'}</td>
                <td>${j.platform || '-'}</td>
                <td>₨ ${j.amount || '-'}</td>
            </tr>`;
        });
        html += `</tbody>得到</div>`;
        document.getElementById("dynamicContent").innerHTML = html;
    }
    
    async function loadRecommendations() {
        const res = await adminApiCall("adminGetRecommendations");
        let html = `<h3><i class="fas fa-star"></i> Recommendations</h3><div style="overflow-x:auto;">表格<thead><tr><th>Email</th><th>WhatsApp</th><th>Phone</th><th>Recommendation</th><th>Date</th><th>Action</th></tr></thead><tbody>`;
        (res.recommendations || []).forEach(r => {
            html += `<tr>
                <td>${r.Email || '-'}</td>
                <td>${r.Whatsapp || '-'}</td>
                <td>${r.Phone || '-'}</td>
                <td>${(r.Text || '').substring(0, 80)}</td>
                <td>${r.Date || '-'}</td>
                <td><button class="btn btn-danger" onclick="deleteRec('${r.Id}')">Delete</button></td>
            </tr>`;
        });
        html += `</tbody>得到</div>`;
        document.getElementById("dynamicContent").innerHTML = html;
    }
    
    window.deleteRec = async (id) => { await adminApiCall("adminDeleteRecommendation", { recId: id }); loadRecommendations(); };
    
    async function loadHelpTickets() {
        const res = await adminApiCall("adminGetHelpTickets");
        let html = `<h3><i class="fas fa-headset"></i> Help Tickets</h3><div style="overflow-x:auto;">表格<thead><tr><th>Email</th><th>Phone</th><th>Message</th><th>Status</th><th>Response</th><th>Action</th><tr></thead><tbody>`;
        (res.tickets || []).forEach(t => {
            html += `<tr>
                <td>${t.Email || '-'}</td>
                <td>${t.Phone || '-'}</td>
                <td>${(t.Message || '').substring(0, 60)}</td>
                <td><span class="status-badge ${t.Status === 'Resolved' ? 'status-approved' : 'status-pending'}">${t.Status || 'Open'}</span></td>
                <td><input id="resp_${t.TicketId}" placeholder="Response"></td>
                <td><button class="btn" onclick="respondTicket('${t.TicketId}')">Send</button></td>
            </tr>`;
        });
        html += `</tbody>得到</div>`;
        document.getElementById("dynamicContent").innerHTML = html;
    }
    
    window.respondTicket = async (id) => { await adminApiCall("adminRespondHelp", { ticketId: id, response: document.getElementById(`resp_${id}`).value }); showToast("Response sent"); loadHelpTickets(); };
    
    async function loadFundRequests() {
        const res = await adminApiCall("adminGetFundRequests");
        let html = `<h3><i class="fas fa-money-bill-wave"></i> Fund Requests</h3><div style="overflow-x:auto;">表格<thead><tr><th>Email</th><th>Amount</th><th>Transaction ID</th><th>Payment Method</th><th>Status</th><th>Action</th></tr></thead><tbody>`;
        (res.requests || []).forEach(f => {
            html += `<tr>
                <td>${f.Email || '-'}</td>
                <td>₨ ${f.Amount || 0}</td>
                <td>${f.TransactionId || '-'}</td>
                <td>${f.PaymentMethod || '-'}</td>
                <td><span class="status-badge ${f.Status === 'Approved' ? 'status-approved' : 'status-pending'}">${f.Status || 'Pending'}</span></td>
                <td>
                    ${f.Status !== 'Approved' ? `<button class="btn btn-success" onclick="approveFund('${f.RequestId}', ${f.Amount})">Approve</button>` : ''}
                    ${f.Status !== 'Rejected' ? `<button class="btn btn-danger" onclick="rejectFund('${f.RequestId}')">Reject</button>` : ''}
                </td>
            </tr>`;
        });
        html += `</tbody>得到</div>`;
        document.getElementById("dynamicContent").innerHTML = html;
    }
    
    window.approveFund = async (id, amount) => { await adminApiCall("adminApproveFund", { requestId: id, amount }); showToast(`₨ ${amount} added to user wallet`); loadFundRequests(); };
    window.rejectFund = async (id) => { await adminApiCall("adminRejectFund", { requestId: id }); showToast("Request rejected"); loadFundRequests(); };
    
    async function loadAdminSettings() {
        let html = `
            <h3><i class="fas fa-user-shield"></i> Admin Settings</h3>
            <div class="glass-card"><h4>🔐 Change Admin Password</h4><input type="password" id="currentAdminPass" placeholder="Current Password"><input type="password" id="newAdminPass" placeholder="New Password"><input type="password" id="confirmAdminPass" placeholder="Confirm Password"><button class="btn" onclick="changeAdminPassword()">Update Password</button></div>
            <div class="glass-card"><h4>👤 Add New Admin</h4><input type="email" id="newAdminEmail" placeholder="Admin Email"><input type="password" id="newAdminPassword" placeholder="Admin Password"><button class="btn btn-success" onclick="addNewAdmin()">Add Admin</button></div>
            <div class="glass-card"><h4>⚙️ System Settings</h4><button class="btn btn-warning" onclick="backupData()">📥 Backup Data</button></div>
        `;
        document.getElementById("dynamicContent").innerHTML = html;
    }
    
    window.changeAdminPassword = async () => {
        let current = document.getElementById("currentAdminPass").value;
        let newPass = document.getElementById("newAdminPass").value;
        let confirm = document.getElementById("confirmAdminPass").value;
        if (newPass !== confirm) { showToast("New passwords don't match", true); return; }
        let res = await adminApiCall("adminChangeOwnPassword", { currentPassword: current, newPassword: newPass });
        showToast(res.message || "Password updated");
    };
    
    window.addNewAdmin = async () => {
        let email = document.getElementById("newAdminEmail").value;
        let password = document.getElementById("newAdminPassword").value;
        if (!email || !password) { showToast("Fill all fields", true); return; }
        let res = await adminApiCall("adminAddNewAdmin", { email, password });
        showToast(res.message || "Admin added");
    };
    
    window.backupData = async () => { let res = await adminApiCall("adminBackupData"); if (res.success) showToast("Backup created"); };
    
    if (adminToken) {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("adminContent").style.display = "block";
        loadDashboard();
        document.querySelector(".admin-nav-btn[data-section='dashboard']").classList.add("active");
    }
    
    document.addEventListener('click', function(e) {
        if (window.innerWidth <= 768) {
            const sidebar = document.getElementById("adminSidebar");
            const toggle = document.getElementById("menuToggle");
            if (!sidebar.contains(e.target) && !toggle.contains(e.target) && sidebar.classList.contains('open')) {
                sidebar.classList.remove('open');
            }
        }
    });
    
    window.closePaymentModal = closePaymentModal;
</script>
</body>
</html>
