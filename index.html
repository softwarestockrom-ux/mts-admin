<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MTS SMM Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #0a0f1c; color: #eef2ff; }
        .admin-container { display: flex; min-height: 100vh; }
        .admin-sidebar { width: 260px; background: rgba(10, 20, 35, 0.95); backdrop-filter: blur(10px); border-right: 1px solid #2d3a5e; padding: 25px 15px; position: fixed; height: 100vh; overflow-y: auto; transition: transform 0.3s ease; z-index: 1000; }
        .admin-main { flex: 1; margin-left: 260px; padding: 25px; }
        .glass-card { background: rgba(15, 25, 45, 0.7); backdrop-filter: blur(12px); border-radius: 24px; border: 1px solid rgba(72, 187, 255, 0.2); padding: 20px; margin-bottom: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 20px; margin-bottom: 30px; }
        .btn { background: linear-gradient(90deg, #2b6ef0, #1a4fc1); border: none; padding: 8px 18px; border-radius: 30px; color: white; cursor: pointer; margin: 5px; font-weight: 500; transition: all 0.2s; }
        .btn:hover { transform: translateY(-2px); opacity: 0.9; }
        .btn-danger { background: linear-gradient(90deg, #dc2626, #b91c1c); }
        .btn-success { background: linear-gradient(90deg, #10b981, #059669); }
        .btn-warning { background: linear-gradient(90deg, #f59e0b, #d97706); }
        input, select, textarea { background: #1e293b; border: 1px solid #334155; padding: 10px 14px; border-radius: 20px; color: white; width: 100%; margin: 8px 0; outline: none; }
        input:focus, select:focus { border-color: #2b6ef0; }
        table { width: 100%; border-collapse: collapse; overflow-x: auto; display: block; }
        th, td { padding: 12px; border-bottom: 1px solid #334155; text-align: left; }
        th { background: rgba(43, 110, 240, 0.2); }
        .tab-buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .tab-btn { background: #1e293b; padding: 8px 20px; border-radius: 40px; cursor: pointer; transition: all 0.2s; }
        .tab-btn.active { background: #2b6ef0; }
        .tab-btn:hover { background: #3b82f6; }
        .service-tab { display: none; }
        .service-tab.active { display: block; }
        .loading { text-align: center; padding: 40px; }
        .loading i { font-size: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .status-pending { background: #f59e0b; color: #000; }
        .status-completed { background: #10b981; color: #fff; }
        .status-progress { background: #3b82f6; color: #fff; }
        @media (max-width: 768px) { 
            .admin-sidebar { transform: translateX(-100%); position: fixed; z-index: 1000; transition: 0.3s; } 
            .admin-sidebar.open { transform: translateX(0); } 
            .admin-main { margin-left: 0; } 
            .menu-toggle { display: block; position: fixed; top: 15px; left: 15px; z-index: 1001; background: #2b6ef0; padding: 12px; border-radius: 50%; cursor: pointer; }
            table { font-size: 12px; }
            td, th { padding: 8px; }
        }
        .menu-toggle { display: none; }
        .admin-nav-btn { background: transparent; border: none; color: #eef2ff; padding: 12px 15px; text-align: left; border-radius: 12px; cursor: pointer; transition: all 0.2s; font-size: 14px; }
        .admin-nav-btn:hover { background: #2b6ef0; }
        .admin-nav-btn i { width: 25px; margin-right: 10px; }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #1e293b; padding: 12px 20px; border-radius: 40px; z-index: 2000; border-left: 4px solid #10b981; }
    </style>
</head>
<body>
<div class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></div>
<div class="admin-container">
    <div class="admin-sidebar" id="adminSidebar">
        <h2 style="margin-bottom: 30px;"><i class="fas fa-crown"></i> MTS Admin</h2>
        <div style="display: flex; flex-direction: column; gap: 5px;">
            <button class="admin-nav-btn" data-section="dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</button>
            <button class="admin-nav-btn" data-section="users"><i class="fas fa-users"></i> Users</button>
            <button class="admin-nav-btn" data-section="orders"><i class="fas fa-shopping-cart"></i> Orders</button>
            <button class="admin-nav-btn" data-section="services-mgt"><i class="fas fa-cogs"></i> Services Mgmt</button>
            <button class="admin-nav-btn" data-section="join-mgt"><i class="fas fa-user-plus"></i> Join Requests</button>
            <button class="admin-nav-btn" data-section="recommendations"><i class="fas fa-star"></i> Recommendations</button>
            <button class="admin-nav-btn" data-section="help"><i class="fas fa-headset"></i> Help Tickets</button>
            <button class="admin-nav-btn" data-section="funds"><i class="fas fa-money-bill-wave"></i> Fund Requests</button>
            <button class="admin-nav-btn" id="adminLogoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </div>
    <div class="admin-main" id="adminMain">
        <div id="loginScreen" class="glass-card" style="max-width: 450px; margin: 80px auto;">
            <h2 style="margin-bottom: 20px;">Admin Login</h2>
            <input type="text" id="adminEmail" placeholder="Admin Email" value="admin@mts.com">
            <input type="password" id="adminPassword" placeholder="Password" value="Admin@123">
            <button id="adminLoginBtn" class="btn" style="width:100%; margin-top:15px;">Login</button>
        </div>
        <div id="adminContent" style="display: none;">
            <div class="stats-grid" id="statsCards"></div>
            <div class="glass-card">
                <div id="dynamicContent">Select a section from the sidebar</div>
            </div>
        </div>
    </div>
</div>

<script>
    // ========== REPLACE WITH YOUR APPS SCRIPT URL ==========
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyOlV_XyOIhuYsOkmLlCvTpxGuVyjA_trHpBH6G-ahD4UiANTBVDEtqirYzkhIfh3NcPw/exec";
    // ========================================================
    
    let adminToken = localStorage.getItem("adminToken");
    let currentSection = "dashboard";
    
    function showToast(message, isError = false) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.borderLeftColor = isError ? '#dc2626' : '#10b981';
        toast.innerHTML = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
    
    async function adminApiCall(action, data = {}) {
        try {
            const payload = { action, adminToken, ...data };
            const formData = new FormData();
            formData.append("payload", JSON.stringify(payload));
            
            const res = await fetch(APPS_SCRIPT_URL, { method: "POST", body: formData });
            const text = await res.text();
            const result = JSON.parse(text);
            
            if (!result.success && result.error === 'Please login again') {
                localStorage.removeItem("adminToken");
                adminToken = null;
                document.getElementById("loginScreen").style.display = "block";
                document.getElementById("adminContent").style.display = "none";
                showToast("Session expired. Please login again.", true);
            }
            return result;
        } catch(err) {
            console.error("API Error:", err);
            showToast("Connection error: " + err.message, true);
            return { success: false, error: err.message };
        }
    }
    
    // Login
    document.getElementById("adminLoginBtn")?.addEventListener("click", async () => {
        const email = document.getElementById("adminEmail").value;
        const password = document.getElementById("adminPassword").value;
        showToast("Logging in...");
        const res = await adminApiCall("adminLogin", { email, password });
        if (res.success) {
            adminToken = res.token;
            localStorage.setItem("adminToken", adminToken);
            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("adminContent").style.display = "block";
            showToast("Login successful!");
            loadDashboard();
        } else {
            showToast(res.error || "Login failed", true);
        }
    });
    
    document.getElementById("adminLogoutBtn")?.addEventListener("click", () => {
        localStorage.removeItem("adminToken");
        adminToken = null;
        document.getElementById("loginScreen").style.display = "block";
        document.getElementById("adminContent").style.display = "none";
        showToast("Logged out");
    });
    
    // Navigation
    document.querySelectorAll(".admin-nav-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            const section = btn.getAttribute("data-section");
            if (section) {
                currentSection = section;
                loadSection(section);
            }
            if (window.innerWidth <= 768) {
                document.getElementById("adminSidebar").classList.remove("open");
            }
        });
    });
    
    document.getElementById("menuToggle")?.addEventListener("click", () => {
        document.getElementById("adminSidebar").classList.toggle("open");
    });
    
    async function loadSection(section) {
        document.getElementById("dynamicContent").innerHTML = '<div class="loading"><i class="fas fa-spinner"></i> Loading...</div>';
        
        switch(section) {
            case "dashboard":
                await loadDashboard();
                break;
            case "users":
                await loadUsers();
                break;
            case "orders":
                await loadOrders();
                break;
            case "services-mgt":
                await loadServicesManagement();
                break;
            case "join-mgt":
                await loadJoinRequests();
                break;
            case "recommendations":
                await loadRecommendations();
                break;
            case "help":
                await loadHelpTickets();
                break;
            case "funds":
                await loadFundRequests();
                break;
        }
    }
    
    async function loadDashboard() {
        const stats = await adminApiCall("adminGetStats");
        if (stats.success) {
            document.getElementById("statsCards").innerHTML = `
                <div class="glass-card"><i class="fas fa-users"></i><br><h2>${stats.totalUsers || 0}</h2><p>Total Users</p></div>
                <div class="glass-card"><i class="fas fa-shopping-cart"></i><br><h2>${stats.totalOrders || 0}</h2><p>Total Orders</p></div>
                <div class="glass-card"><i class="fas fa-rupee-sign"></i><br><h2>${stats.totalRevenue || 0}</h2><p>Revenue (PKR)</p></div>
                <div class="glass-card"><i class="fas fa-clock"></i><br><h2>${stats.pendingOrders || 0}</h2><p>Pending Orders</p></div>
            `;
            document.getElementById("dynamicContent").innerHTML = '<p style="text-align:center; color:#94a3b8;">Select a section from the sidebar to manage</p>';
        } else {
            document.getElementById("dynamicContent").innerHTML = '<p class="loading">Failed to load dashboard</p>';
        }
    }
    
    async function loadUsers() {
        const res = await adminApiCall("adminGetAllUsers");
        if (!res.success || !res.users) {
            document.getElementById("dynamicContent").innerHTML = '<p>Failed to load users</p>';
            return;
        }
        
        let html = `<h3><i class="fas fa-users"></i> User Management</h3>
        <div style="overflow-x:auto;">
        <table>
            <thead><tr><th>User ID</th><th>Full Name</th><th>Email</th><th>Phone</th><th>Wallet</th><th>Type</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>`;
        
        res.users.forEach(u => {
            html += `<tr>
                <td>${u.userId || u.UserId || 'N/A'}</td>
                <td>${u.fullName || u.FullName || 'N/A'}</td>
                <td>${u.gmail || u.Gmail || 'N/A'}</td>
                <td>${u.phone || u.Phone || 'N/A'}</td>
                <td>${u.wallet || u.Wallet || 0} PKR</td>
                <td>${u.userType || u.UserType || 'Standard'}</td>
                <td><span class="status-badge ${(u.blocked === true || u.Blocked === true) ? 'status-pending' : 'status-completed'}">${(u.blocked === true || u.Blocked === true) ? 'Blocked' : 'Active'}</span></td>
                <td>
                    <button class="btn btn-sm" onclick="toggleUserBlock('${u.userId || u.UserId}')">${(u.blocked === true || u.Blocked === true) ? 'Unblock' : 'Block'}</button>
                    <button class="btn btn-sm" onclick="changeUserPass('${u.userId || u.UserId}')">Change Pass</button>
                </td>
            </tr>`;
        });
        
        html += `</tbody></table></div>`;
        document.getElementById("dynamicContent").innerHTML = html;
    }
    
    window.toggleUserBlock = async (userId) => {
        const res = await adminApiCall("adminGetAllUsers");
        const user = res.users?.find(u => (u.userId || u.UserId) === userId);
        const newBlockStatus = !(user?.blocked === true || user?.Blocked === true);
        await adminApiCall("adminToggleBlockUser", { userId, block: newBlockStatus });
        showToast(`User ${newBlockStatus ? 'blocked' : 'unblocked'} successfully`);
        loadUsers();
    };
    
    window.changeUserPass = async (userId) => {
        const newPass = prompt("Enter new password:");
        if (newPass && newPass.length >= 4) {
            const res = await adminApiCall("adminChangePassword", { userId, newPassword: newPass });
            if (res.success) showToast("Password updated");
            else showToast(res.error, true);
        } else if (newPass) {
            showToast("Password must be at least 4 characters", true);
        }
    };
    
    async function loadOrders() {
        const res = await adminApiCall("adminGetAllOrders");
        if (!res.success || !res.orders) {
            document.getElementById("dynamicContent").innerHTML = '<p>Failed to load orders</p>';
            return;
        }
        
        let html = `<h3><i class="fas fa-shopping-cart"></i> Order Management</h3>
        <div style="overflow-x:auto;">
        <table>
            <thead><tr><th>Order ID</th><th>User</th><th>Service</th><th>Quantity</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead>
            <tbody>`;
        
        res.orders.forEach(o => {
            html += `<tr>
                <td>${o.orderId || o.OrderId || 'N/A'}</td>
                <td>${o.userName || 'Unknown'}</td>
                <td>${o.serviceName || o.ServiceName || 'N/A'}</td>
                <td>${o.qty || o.Quantity || 0}</td>
                <td>${o.amount || o.Amount || 0} PKR</td>
                <td>
                    <select id="status_${o.orderId || o.OrderId}" class="status-select">
                        <option ${(o.status === 'Pending') ? 'selected' : ''}>Pending</option>
                        <option ${(o.status === 'In Progress') ? 'selected' : ''}>In Progress</option>
                        <option ${(o.status === 'Completed') ? 'selected' : ''}>Completed</option>
                        <option ${(o.status === 'Partially Completed') ? 'selected' : ''}>Partially Completed</option>
                        <option ${(o.status === 'Cancelled') ? 'selected' : ''}>Cancelled</option>
                        <option ${(o.status === 'Refunded') ? 'selected' : ''}>Refunded</option>
                        <option ${(o.status === 'Refilled') ? 'selected' : ''}>Refilled</option>
                    </select>
                </td>
                <td><button class="btn" onclick="updateOrderStatus('${o.orderId || o.OrderId}')">Update</button></td>
            </tr>`;
        });
        
        html += `</tbody></table></div>`;
        document.getElementById("dynamicContent").innerHTML = html;
    }
    
    window.updateOrderStatus = async (orderId) => {
        const select = document.getElementById(`status_${orderId}`);
        const newStatus = select.value;
        const res = await adminApiCall("adminUpdateOrderStatus", { orderId, status: newStatus });
        if (res.success) {
            showToast(`Order ${orderId} status updated to ${newStatus}`);
            loadOrders();
        } else {
            showToast(res.error || "Update failed", true);
        }
    };
    
    async function loadServicesManagement() {
        const servicesRes = await adminApiCall("adminGetServices");
        const services = servicesRes.services || [];
        
        let html = `
            <h3><i class="fas fa-cogs"></i> Service Management</h3>
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="showServiceTab('add')">Add Service</button>
                <button class="tab-btn" onclick="showServiceTab('edit')">Edit Service</button>
                <button class="tab-btn" onclick="showServiceTab('delete')">Delete Service</button>
            </div>
            
            <div id="addServiceTab" class="service-tab active">
                <h4>Add New Service</h4>
                <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <input id="servName" placeholder="Service Name">
                    <input id="servPlatform" placeholder="Platform (e.g., Instagram)">
                    <input id="servRate" type="number" placeholder="Rate (PKR)">
                    <input id="servMin" type="number" placeholder="Min Quantity">
                    <input id="servMax" type="number" placeholder="Max Quantity">
                    <input id="servDelivery" placeholder="Delivery Time">
                </div>
                <textarea id="servDesc" placeholder="Description" rows="3"></textarea>
                <div style="display: flex; gap: 15px; flex-wrap: wrap; margin: 15px 0;">
                    <label><input type="checkbox" id="servPer1k"> Per 1k (price per 1000)</label>
                    <label><input type="checkbox" id="servIsAccount"> Is Account (requires email)</label>
                    <label><input type="checkbox" id="servRequireLink"> Require Link</label>
                    <label><input type="checkbox" id="servCustomComments"> Custom Comments</label>
                </div>
                <button class="btn" onclick="addService()">Save Service</button>
            </div>
            
            <div id="editServiceTab" class="service-tab" style="display:none;">
                <h4>Edit Service</h4>
                <select id="editServiceSelect" style="margin-bottom: 15px;">
                    <option value="">Select a service</option>
                    ${services.map(s => `<option value="${s.ServiceId}">${s.Name} (${s.Platform})</option>`).join('')}
                </select>
                <div id="editFields"></div>
                <button class="btn" onclick="updateService()">Update Service</button>
            </div>
            
            <div id="deleteServiceTab" class="service-tab" style="display:none;">
                <h4>Delete Service</h4>
                <select id="deleteServiceSelect">
                    <option value="">Select a service to delete</option>
                    ${services.map(s => `<option value="${s.ServiceId}">${s.Name} (${s.Platform})</option>`).join('')}
                </select>
                <button class="btn btn-danger" onclick="deleteService()" style="margin-top: 15px;">Delete Permanently</button>
            </div>
        `;
        
        document.getElementById("dynamicContent").innerHTML = html;
        
        document.getElementById("editServiceSelect")?.addEventListener("change", async (e) => {
            const serviceId = e.target.value;
            if (serviceId) {
                const servicesRes = await adminApiCall("adminGetServices");
                const svc = servicesRes.services?.find(s => s.ServiceId === serviceId);
                if (svc) {
                    document.getElementById("editFields").innerHTML = `
                        <input id="editName" value="${svc.Name || ''}" placeholder="Service Name">
                        <input id="editRate" value="${svc.Rate || 0}" type="number" placeholder="Rate">
                        <input id="editMin" value="${svc.MinQty || 0}" type="number" placeholder="Min Qty">
                        <input id="editMax" value="${svc.MaxQty || 0}" type="number" placeholder="Max Qty">
                        <input id="editDelivery" value="${svc.DeliveryTime || ''}" placeholder="Delivery Time">
                        <textarea id="editDesc" placeholder="Description">${svc.Description || ''}</textarea>
                    `;
                }
            }
        });
    }
    
    window.showServiceTab = (tab) => {
        document.querySelectorAll('.service-tab').forEach(t => t.style.display = 'none');
        document.getElementById(`${tab}ServiceTab`).style.display = 'block';
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
    };
    
    window.addService = async () => {
        const payload = {
            name: document.getElementById("servName").value,
            platform: document.getElementById("servPlatform").value,
            rate: parseFloat(document.getElementById("servRate").value),
            minQty: parseInt(document.getElementById("servMin").value),
            maxQty: parseInt(document.getElementById("servMax").value),
            deliveryTime: document.getElementById("servDelivery").value,
            description: document.getElementById("servDesc").value,
            per1k: document.getElementById("servPer1k").checked,
            isAccount: document.getElementById("servIsAccount").checked,
            requireLink: document.getElementById("servRequireLink").checked,
            customComments: document.getElementById("servCustomComments").checked
        };
        const res = await adminApiCall("adminAddService", payload);
        if (res.success) {
            showToast("Service added successfully");
            loadServicesManagement();
        } else {
            showToast(res.error || "Failed to add service", true);
        }
    };
    
    window.updateService = async () => {
        const serviceId = document.getElementById("editServiceSelect").value;
        if (!serviceId) { showToast("Select a service", true); return; }
        const data = {
            serviceId: serviceId,
            name: document.getElementById("editName").value,
            rate: parseFloat(document.getElementById("editRate").value),
            minQty: parseInt(document.getElementById("editMin").value),
            maxQty: parseInt(document.getElementById("editMax").value),
            deliveryTime: document.getElementById("editDelivery").value,
            description: document.getElementById("editDesc").value
        };
        const res = await adminApiCall("adminEditService", data);
        if (res.success) {
            showToast("Service updated successfully");
            loadServicesManagement();
        } else {
            showToast(res.error || "Failed to update", true);
        }
    };
    
    window.deleteService = async () => {
        const serviceId = document.getElementById("deleteServiceSelect").value;
        if (!serviceId) { showToast("Select a service", true); return; }
        if (confirm("Are you sure you want to delete this service?")) {
            const res = await adminApiCall("adminDeleteService", { serviceId });
            if (res.success) {
                showToast("Service deleted");
                loadServicesManagement();
            } else {
                showToast(res.error || "Failed to delete", true);
            }
        }
    };
    
    async function loadJoinRequests() {
        const res = await adminApiCall("adminGetJoinRequests");
        if (!res.success || !res.requests) {
            document.getElementById("dynamicContent").innerHTML = '<p>Failed to load join requests</p>';
            return;
        }
        
        let html = `<h3><i class="fas fa-user-plus"></i> Join Requests</h3>
        <div style="overflow-x:auto;">
        <table>
            <thead><tr><th>Name</th><th>Email</th><th>Type</th><th>Status</th><th>Set Salary</th><th>Actions</th></tr></thead>
            <tbody>`;
        
        res.requests.forEach(j => {
            html += `<tr>
                <td>${j.name || 'N/A'}</td>
                <td>${j.email || 'N/A'}</td>
                <td>${j.salaryType || 'N/A'}</td>
                <td><span class="status-badge ${j.status === 'Approved' ? 'status-completed' : 'status-pending'}">${j.status || 'Pending'}</span></td>
                <td><input type="number" id="salary_${j.id}" placeholder="Salary" value="${j.salary || ''}" style="width:100px"><button class="btn btn-sm" onclick="setJoinSalary('${j.id}')">Set</button></td>
                <td>
                    <button class="btn btn-sm btn-success" onclick="approveJoin('${j.id}')">Approve</button>
                    <button class="btn btn-sm btn-danger" onclick="rejectJoin('${j.id}')">Reject</button>
                </td>
            </tr>`;
        });
        
        html += `</tbody></table></div>`;
        document.getElementById("dynamicContent").innerHTML = html;
    }
    
    window.setJoinSalary = async (id) => {
        const salary = document.getElementById(`salary_${id}`).value;
        await adminApiCall("adminSetJoinSalary", { requestId: id, salary });
        showToast("Salary set");
        loadJoinRequests();
    };
    
    window.approveJoin = async (id) => {
        await adminApiCall("adminApproveJoin", { requestId: id });
        showToast("Application approved");
        loadJoinRequests();
    };
    
    window.rejectJoin = async (id) => {
        await adminApiCall("adminRejectJoin", { requestId: id });
        showToast("Application rejected");
        loadJoinRequests();
    };
    
    async function loadRecommendations() {
        const res = await adminApiCall("adminGetRecommendations");
        if (!res.success || !res.recommendations) {
            document.getElementById("dynamicContent").innerHTML = '<p>Failed to load recommendations</p>';
            return;
        }
        
        let html = `<h3><i class="fas fa-star"></i> User Recommendations</h3>
        <div style="overflow-x:auto;">
        <table>
            <thead><tr><th>Email</th><th>WhatsApp</th><th>Phone</th><th>Recommendation</th><th>Actions</th></tr></thead>
            <tbody>`;
        
        res.recommendations.forEach(r => {
            html += `<tr>
                <td>${r.Email || r.email || 'N/A'}</td>
                <td>${r.Whatsapp || r.whatsapp || 'N/A'}</td>
                <td>${r.Phone || r.phone || 'N/A'}</td>
                <td>${(r.Text || r.text || '').substring(0, 100)}</td>
                <td><button class="btn btn-sm btn-danger" onclick="deleteRecommendation('${r.Id || r.id}')">Delete</button></td>
            </tr>`;
        });
        
        html += `</tbody></table></div>`;
        document.getElementById("dynamicContent").innerHTML = html;
    }
    
    window.deleteRecommendation = async (id) => {
        if (confirm("Delete this recommendation?")) {
            await adminApiCall("adminDeleteRecommendation", { recId: id });
            showToast("Deleted");
            loadRecommendations();
        }
    };
    
    async function loadHelpTickets() {
        const res = await adminApiCall("adminGetHelpTickets");
        if (!res.success || !res.tickets) {
            document.getElementById("dynamicContent").innerHTML = '<p>Failed to load help tickets</p>';
            return;
        }
        
        let html = `<h3><i class="fas fa-headset"></i> Help Tickets</h3>
        <div style="overflow-x:auto;">
        <table>
            <thead><tr><th>Email</th><th>Phone</th><th>Message</th><th>Status</th><th>Response</th><th>Action</th></tr></thead>
            <tbody>`;
        
        res.tickets.forEach(t => {
            html += `<tr>
                <td>${t.Email || t.email || 'N/A'}</td>
                <td>${t.Phone || t.phone || 'N/A'}</td>
                <td>${(t.Message || t.message || '').substring(0, 80)}</td>
                <td><span class="status-badge ${t.Status === 'Resolved' ? 'status-completed' : 'status-pending'}">${t.Status || 'Open'}</span></td>
                <td><input type="text" id="resp_${t.TicketId || t.id}" placeholder="Response" style="width:150px"></td>
                <td><button class="btn btn-sm" onclick="respondToTicket('${t.TicketId || t.id}')">Send</button></td>
            </tr>`;
        });
        
        html += `</tbody></table></div>`;
        document.getElementById("dynamicContent").innerHTML = html;
    }
    
    window.respondToTicket = async (id) => {
        const response = document.getElementById(`resp_${id}`).value;
        if (!response) { showToast("Enter a response", true); return; }
        await adminApiCall("adminRespondHelp", { ticketId: id, response });
        showToast("Response sent");
        loadHelpTickets();
    };
    
    async function loadFundRequests() {
        const res = await adminApiCall("adminGetFundRequests");
        if (!res.success || !res.requests) {
            document.getElementById("dynamicContent").innerHTML = '<p>Failed to load fund requests</p>';
            return;
        }
        
        let html = `<h3><i class="fas fa-money-bill-wave"></i> Fund Requests</h3>
        <div style="overflow-x:auto;">
        <table>
            <thead><tr><th>Email</th><th>Amount</th><th>Transaction ID</th><th>Status</th><th>Action</th></tr></thead>
            <tbody>`;
        
        res.requests.forEach(f => {
            html += `<tr>
                <td>${f.Email || f.email || 'N/A'}</td>
                <td>${f.Amount || f.amount || 0} PKR</td>
                <td>${f.TransactionId || f.transactionId || 'N/A'}</td>
                <td><span class="status-badge ${f.Status === 'Approved' ? 'status-completed' : 'status-pending'}">${f.Status || 'Pending'}</span></td>
                <td>
                    ${f.Status !== 'Approved' ? `<button class="btn btn-sm btn-success" onclick="approveFundRequest('${f.RequestId || f.id}', ${f.Amount || f.amount})">Approve</button>` : ''}
                    ${f.Status !== 'Rejected' ? `<button class="btn btn-sm btn-danger" onclick="rejectFundRequest('${f.RequestId || f.id}')">Reject</button>` : ''}
                </td>
            </tr>`;
        });
        
        html += `</tbody></table></div>`;
        document.getElementById("dynamicContent").innerHTML = html;
    }
    
    window.approveFundRequest = async (id, amount) => {
        if (confirm(`Approve fund request of ${amount} PKR?`)) {
            const res = await adminApiCall("adminApproveFund", { requestId: id, amount });
            if (res.success) {
                showToast("Funds added to user wallet");
                loadFundRequests();
            } else {
                showToast(res.error || "Failed", true);
            }
        }
    };
    
    window.rejectFundRequest = async (id) => {
        if (confirm("Reject this fund request?")) {
            await adminApiCall("adminRejectFund", { requestId: id });
            showToast("Request rejected");
            loadFundRequests();
        }
    };
    
    // Auto login if token exists
    if (adminToken) {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("adminContent").style.display = "block";
        loadDashboard();
    }
    
    // Mobile sidebar close on click outside
    document.addEventListener('click', function(e) {
        if (window.innerWidth <= 768) {
            const sidebar = document.getElementById("adminSidebar");
            const toggle = document.getElementById("menuToggle");
            if (!sidebar.contains(e.target) && !toggle.contains(e.target) && sidebar.classList.contains('open')) {
                sidebar.classList.remove('open');
            }
        }
    });
</script>
</body>
</html>
